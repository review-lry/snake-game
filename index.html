<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 贪吃蛇游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-wrapper {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            font-size: 1.2em;
            color: #555;
        }

        .score-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
        }

        #gameCanvas {
            border: 3px solid #333;
            border-radius: 10px;
            background: #1a1a2e;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            display: block;
            margin: 0 auto;
        }

        .controls {
            margin-top: 20px;
            color: #666;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px 5px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .mobile-controls {
            display: none;
            margin-top: 20px;
            grid-template-columns: repeat(3, 60px);
            grid-gap: 5px;
            justify-content: center;
        }

        .mobile-btn {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 24px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .mobile-btn:active {
            transform: scale(0.95);
        }

        /* 排行榜样式 */
        .leaderboard {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 280px;
            max-height: 520px;
            overflow-y: auto;
        }

        .leaderboard h2 {
            color: #333;
            font-size: 1.5em;
            margin-bottom: 15px;
            text-align: center;
        }

        .leaderboard-list {
            list-style: none;
        }

        .leaderboard-item {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 10px 15px;
            margin: 8px 0;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
        }

        .leaderboard-item:hover {
            transform: translateX(5px);
        }

        .leaderboard-item.top-1 {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            font-weight: bold;
        }

        .leaderboard-item.top-2 {
            background: linear-gradient(135deg, #c0c0c0 0%, #e8e8e8 100%);
        }

        .leaderboard-item.top-3 {
            background: linear-gradient(135deg, #cd7f32 0%, #e5a86b 100%);
        }

        .rank {
            font-size: 1.2em;
            font-weight: bold;
            color: #667eea;
            min-width: 30px;
        }

        .player-info {
            flex: 1;
            text-align: left;
            padding: 0 10px;
        }

        .player-name {
            font-weight: 600;
            color: #333;
        }

        .player-score {
            font-weight: bold;
            color: #764ba2;
            font-size: 1.1em;
        }

        .empty-leaderboard {
            text-align: center;
            color: #999;
            padding: 30px 10px;
        }

        @media (max-width: 900px) {
            .game-wrapper {
                flex-direction: column;
                align-items: center;
            }

            .leaderboard {
                width: 100%;
                max-width: 460px;
            }
        }

        @media (max-width: 600px) {
            .game-container {
                padding: 15px;
            }

            h1 {
                font-size: 1.8em;
            }

            #gameCanvas {
                width: 100%;
                max-width: 320px;
                height: auto;
            }

            .mobile-controls {
                display: grid;
            }

            .controls {
                display: none;
            }

            .leaderboard {
                width: 100%;
                max-width: 350px;
            }
        }

        .game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            min-width: 320px;
        }

        .game-over.show {
            display: block;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
        }

        .overlay.show {
            display: block;
        }

        /* 昵称输入样式 */
        .nickname-input {
            margin: 20px 0;
        }

        .nickname-input input {
            padding: 12px 20px;
            font-size: 1em;
            border: 2px solid #667eea;
            border-radius: 10px;
            width: 100%;
            max-width: 250px;
            text-align: center;
            outline: none;
        }

        .nickname-input input:focus {
            border-color: #764ba2;
        }

        .nickname-input p {
            color: #666;
            margin-top: 10px;
            font-size: 0.9em;
        }

        .save-btn {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            margin-top: 15px;
        }

        .save-btn:hover {
            box-shadow: 0 5px 15px rgba(34, 197, 94, 0.4);
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="game-container">
            <h1>🐍 贪吃蛇</h1>
            
            <div class="score-board">
                <div class="score-item">
                    <span>得分: </span><span id="score">0</span>
                </div>
                <div class="score-item">
                    <span>最高分: </span><span id="highScore">0</span>
                </div>
            </div>

            <canvas id="gameCanvas" width="400" height="400"></canvas>

            <div class="controls">
                <p>使用 <strong>方向键</strong> 或 <strong>WASD</strong> 控制蛇的移动</p>
                <button class="btn" onclick="startGame()">开始游戏</button>
                <button class="btn" onclick="pauseGame()">暂停</button>
            </div>

            <div class="mobile-controls">
                <div></div>
                <button class="mobile-btn" onclick="changeDirection('up')">↑</button>
                <div></div>
                <button class="mobile-btn" onclick="changeDirection('left')">←</button>
                <button class="mobile-btn" onclick="changeDirection('down')">↓</button>
                <button class="mobile-btn" onclick="changeDirection('right')">→</button>
            </div>
        </div>

        <div class="leaderboard">
            <h2>🏆 排行榜</h2>
            <ul class="leaderboard-list" id="leaderboardList">
                <li class="empty-leaderboard">暂无记录，快来挑战吧！</li>
            </ul>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="game-over" id="gameOver">
        <h2>游戏结束！</h2>
        <p>你的得分: <strong id="finalScore">0</strong></p>
        <p id="newHighScore" style="color: #667eea; display: none;">🎉 新纪录！</p>
        
        <div class="nickname-input" id="nicknameSection">
            <input type="text" id="nicknameInput" placeholder="输入你的昵称" maxlength="10">
            <p>最多10个字符</p>
            <button class="btn save-btn" onclick="saveScore()">保存成绩</button>
        </div>
        
        <button class="btn" onclick="restartGame()" id="restartBtn" style="display: none;">再来一局</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameLoop;
        let gameRunning = false;
        let gamePaused = false;
        let leaderboard = JSON.parse(localStorage.getItem('snakeLeaderboard')) || [];

        document.getElementById('highScore').textContent = highScore;
        updateLeaderboard();

        function drawGame() {
            if (gamePaused) return;

            // 移动蛇
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // 检查碰撞
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // 检查是否吃到食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                generateFood();
            } else {
                snake.pop();
            }

            // 清空画布
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制网格
            ctx.strokeStyle = '#2a2a4e';
            for (let i = 0; i < tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // 绘制食物
            ctx.fillStyle = '#ff6b6b';
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                gridSize / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();

            // 绘制蛇
            snake.forEach((segment, index) => {
                const gradient = ctx.createLinearGradient(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    segment.x * gridSize + gridSize,
                    segment.y * gridSize + gridSize
                );
                
                if (index === 0) {
                    gradient.addColorStop(0, '#4ade80');
                    gradient.addColorStop(1, '#22c55e');
                } else {
                    gradient.addColorStop(0, '#22c55e');
                    gradient.addColorStop(1, '#16a34a');
                }
                
                ctx.fillStyle = gradient;
                ctx.fillRect(
                    segment.x * gridSize + 1,
                    segment.y * gridSize + 1,
                    gridSize - 2,
                    gridSize - 2
                );

                // 绘制蛇头眼睛
                if (index === 0) {
                    ctx.fillStyle = 'white';
                    const eyeSize = 3;
                    const eyeOffset = 5;
                    
                    if (dx === 1) {
                        ctx.fillRect(segment.x * gridSize + gridSize - eyeOffset, segment.y * gridSize + 5, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + gridSize - eyeOffset, segment.y * gridSize + gridSize - 8, eyeSize, eyeSize);
                    } else if (dx === -1) {
                        ctx.fillRect(segment.x * gridSize + eyeOffset - eyeSize, segment.y * gridSize + 5, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + eyeOffset - eyeSize, segment.y * gridSize + gridSize - 8, eyeSize, eyeSize);
                    } else if (dy === -1) {
                        ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + eyeOffset - eyeSize, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + gridSize - 8, segment.y * gridSize + eyeOffset - eyeSize, eyeSize, eyeSize);
                    } else {
                        ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + gridSize - eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + gridSize - 8, segment.y * gridSize + gridSize - eyeOffset, eyeSize, eyeSize);
                    }
                }
            });
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    generateFood();
                    return;
                }
            }
        }

        function changeDirection(direction) {
            if (!gameRunning) return;

            switch(direction) {
                case 'up':
                    if (dy !== 1) { dx = 0; dy = -1; }
                    break;
                case 'down':
                    if (dy !== -1) { dx = 0; dy = 1; }
                    break;
                case 'left':
                    if (dx !== 1) { dx = -1; dy = 0; }
                    break;
                case 'right':
                    if (dx !== -1) { dx = 1; dy = 0; }
                    break;
            }
        }

        document.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd'].includes(e.key)) {
                e.preventDefault();
            }

            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    changeDirection('up');
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    changeDirection('down');
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    changeDirection('left');
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    changeDirection('right');
                    break;
            }
        });

        function startGame() {
            if (gameRunning) return;

            snake = [{x: 10, y: 10}];
            dx = 1;
            dy = 0;
            score = 0;
            document.getElementById('score').textContent = score;
            generateFood();
            gameRunning = true;
            gamePaused = false;
            gameLoop = setInterval(drawGame, 100);
        }

        function pauseGame() {
            if (!gameRunning) return;
            gamePaused = !gamePaused;
        }

        function gameOver() {
            gameRunning = false;
            clearInterval(gameLoop);
            
            document.getElementById('finalScore').textContent = score;
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                document.getElementById('highScore').textContent = highScore;
                document.getElementById('newHighScore').style.display = 'block';
            } else {
                document.getElementById('newHighScore').style.display = 'none';
            }

            // 显示昵称输入区域
            document.getElementById('nicknameSection').style.display = 'block';
            document.getElementById('restartBtn').style.display = 'none';
            document.getElementById('nicknameInput').value = '';
            document.getElementById('nicknameInput').focus();

            document.getElementById('overlay').classList.add('show');
            document.getElementById('gameOver').classList.add('show');
        }

        function saveScore() {
            const nickname = document.getElementById('nicknameInput').value.trim();
            
            if (!nickname) {
                alert('请输入昵称！');
                return;
            }

            // 添加到排行榜
            const entry = {
                name: nickname,
                score: score,
                date: new Date().toLocaleDateString('zh-CN')
            };

            leaderboard.push(entry);
            
            // 按分数排序，取前10名
            leaderboard.sort((a, b) => b.score - a.score);
            leaderboard = leaderboard.slice(0, 10);
            
            // 保存到本地存储
            localStorage.setItem('snakeLeaderboard', JSON.stringify(leaderboard));
            
            // 更新排行榜显示
            updateLeaderboard();

            // 隐藏昵称输入，显示重新开始按钮
            document.getElementById('nicknameSection').style.display = 'none';
            document.getElementById('restartBtn').style.display = 'inline-block';
        }

        function updateLeaderboard() {
            const list = document.getElementById('leaderboardList');
            
            if (leaderboard.length === 0) {
                list.innerHTML = '<li class="empty-leaderboard">暂无记录，快来挑战吧！</li>';
                return;
            }

            list.innerHTML = leaderboard.map((entry, index) => {
                const rankClass = index < 3 ? `top-${index + 1}` : '';
                const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}`;
                
                return `
                    <li class="leaderboard-item ${rankClass}">
                        <span class="rank">${medal}</span>
                        <div class="player-info">
                            <div class="player-name">${entry.name}</div>
                        </div>
                        <span class="player-score">${entry.score}</span>
                    </li>
                `;
            }).join('');
        }

        function restartGame() {
            document.getElementById('overlay').classList.remove('show');
            document.getElementById('gameOver').classList.remove('show');
            startGame();
        }

        // 初始绘制
        drawGame();

        // 昵称输入框回车保存
        document.getElementById('nicknameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                saveScore();
            }
        });
    </script>
</body>
</html>
