<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 贪吃蛇游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-wrapper {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        /* 难度选择器 */
        .difficulty-selector {
            margin: 15px 0;
        }

        .difficulty-selector label {
            color: #666;
            font-weight: bold;
            margin-right: 10px;
        }

        .difficulty-btn {
            padding: 8px 16px;
            margin: 0 5px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .difficulty-btn:hover {
            transform: translateY(-2px);
        }

        .difficulty-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        /* 皮肤选择器 */
        .skin-selector {
            margin: 15px 0;
        }

        .skin-selector label {
            color: #666;
            font-weight: bold;
            margin-right: 10px;
        }

        .skin-btn {
            padding: 8px 16px;
            margin: 0 5px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .skin-btn:hover {
            transform: translateY(-2px);
        }

        .skin-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        /* 挑战模式 */
        .challenge-mode {
            margin: 10px 0;
        }

        .challenge-mode label {
            color: #666;
            font-weight: bold;
        }

        .challenge-mode input[type="checkbox"] {
            margin-left: 10px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            font-size: 1.2em;
            color: #555;
        }

        .score-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
        }

        #gameCanvas {
            border: 3px solid #333;
            border-radius: 10px;
            background: #1a1a2e;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            display: block;
            margin: 0 auto;
        }

        .controls {
            margin-top: 20px;
            color: #666;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px 5px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .mobile-controls {
            display: none;
            margin-top: 20px;
            grid-template-columns: repeat(3, 60px);
            grid-gap: 5px;
            justify-content: center;
        }

        .mobile-btn {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 24px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .mobile-btn:active {
            transform: scale(0.95);
        }

        /* 排行榜样式 */
        .leaderboard {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 280px;
            max-height: 520px;
            overflow-y: auto;
        }

        .leaderboard h2 {
            color: #333;
            font-size: 1.5em;
            margin-bottom: 15px;
            text-align: center;
        }

        .leaderboard-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }

        .leaderboard-tab {
            flex: 1;
            padding: 8px;
            border: none;
            background: #f0f0f0;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #666;
            transition: all 0.3s;
        }

        .leaderboard-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .leaderboard-list {
            list-style: none;
        }

        .leaderboard-item {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 10px 15px;
            margin: 8px 0;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
        }

        .leaderboard-item:hover {
            transform: translateX(5px);
        }

        .leaderboard-item.top-1 {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            font-weight: bold;
        }

        .leaderboard-item.top-2 {
            background: linear-gradient(135deg, #c0c0c0 0%, #e8e8e8 100%);
        }

        .leaderboard-item.top-3 {
            background: linear-gradient(135deg, #cd7f32 0%, #e5a86b 100%);
        }

        .rank {
            font-size: 1.2em;
            font-weight: bold;
            color: #667eea;
            min-width: 30px;
        }

        .player-info {
            flex: 1;
            text-align: left;
            padding: 0 10px;
        }

        .player-name {
            font-weight: 600;
            color: #333;
        }

        .player-score {
            font-weight: bold;
            color: #764ba2;
            font-size: 1.1em;
        }

        .empty-leaderboard {
            text-align: center;
            color: #999;
            padding: 30px 10px;
        }

        /* 音效控制 */
        .sound-control {
            margin: 10px 0;
        }

        .sound-control label {
            color: #666;
            font-weight: bold;
        }

        .sound-control input[type="checkbox"] {
            margin-left: 10px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        @media (max-width: 900px) {
            .game-wrapper {
                flex-direction: column;
                align-items: center;
            }

            .leaderboard {
                width: 100%;
                max-width: 460px;
            }
        }

        @media (max-width: 600px) {
            .game-container {
                padding: 15px;
            }

            h1 {
                font-size: 1.8em;
            }

            #gameCanvas {
                width: 100%;
                max-width: 320px;
                height: auto;
            }

            .mobile-controls {
                display: grid;
            }

            .controls {
                display: none;
            }

            .leaderboard {
                width: 100%;
                max-width: 350px;
            }

            .difficulty-btn, .skin-btn {
                padding: 6px 12px;
                font-size: 0.9em;
                margin: 2px;
            }
        }

        /* 游戏结束模态框 */
        .game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            min-width: 320px;
            max-width: 90vw;
        }

        .game-over.show {
            display: block;
        }

        /* 游戏开始前模态框 */
        .start-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            min-width: 320px;
            max-width: 90vw;
        }

        .start-modal.show {
            display: block;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
        }

        .overlay.show {
            display: block;
        }

        /* 昵称输入样式 */
        .nickname-input {
            margin: 20px 0;
        }

        .nickname-input input {
            padding: 12px 20px;
            font-size: 1em;
            border: 2px solid #667eea;
            border-radius: 10px;
            width: 100%;
            max-width: 250px;
            text-align: center;
            outline: none;
        }

        .nickname-input input:focus {
            border-color: #764ba2;
        }

        .nickname-input p {
            color: #666;
            margin-top: 10px;
            font-size: 0.9em;
        }

        /* 挑战模式提示 */
        .challenge-info {
            background: linear-gradient(135deg, #ff9a56 0%, #ff6b6b 100%);
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            margin: 10px 0;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .challenge-stats {
            display: none;
            color: #666;
            font-size: 0.9em;
            margin: 5px 0;
        }

        .challenge-stats.show {
            display: block;
        }

        .settings-preview {
            background: #f5f7fa;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            text-align: left;
        }

        .settings-preview p {
            color: #666;
            margin: 5px 0;
        }

        .settings-preview strong {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="game-container">
            <h1>🐍 贪吃蛇</h1>
            
            <!-- 难度选择 -->
            <div class="difficulty-selector">
                <label>难度：</label>
                <button class="difficulty-btn active" data-difficulty="easy">简单</button>
                <button class="difficulty-btn" data-difficulty="normal">普通</button>
                <button class="difficulty-btn" data-difficulty="hard">困难</button>
            </div>

            <!-- 皮肤选择 -->
            <div class="skin-selector">
                <label>主题：</label>
                <button class="skin-btn active" data-skin="default">经典</button>
                <button class="skin-btn" data-skin="ocean">海洋</button>
                <button class="skin-btn" data-skin="forest">森林</button>
                <button class="skin-btn" data-skin="sunset">日落</button>
            </div>

            <!-- 挑战模式 -->
            <div class="challenge-mode">
                <label>🎯 挑战模式</label>
                <input type="checkbox" id="challengeMode">
            </div>

            <!-- 音效控制 -->
            <div class="sound-control">
                <label>🔊 音效</label>
                <input type="checkbox" id="soundEnabled" checked>
            </div>

            <!-- 挑战模式信息 -->
            <div class="challenge-info" id="challengeInfo" style="display: none;">
                🎯 挑战模式：在60秒内获得最高分！
            </div>

            <div class="score-board">
                <div class="score-item">
                    <span>得分: </span><span id="score">0</span>
                </div>
                <div class="score-item">
                    <span>最高分: </span><span id="highScore">0</span>
                </div>
                <div class="score-item challenge-stats" id="timerDisplay">
                    <span>⏱️ 时间: </span><span id="timer">60</span>s
                </div>
            </div>

            <canvas id="gameCanvas" width="400" height="400"></canvas>

            <div class="controls">
                <p>使用 <strong>方向键</strong> 或 <strong>WASD</strong> 控制蛇的移动</p>
                <button class="btn" onclick="showStartModal()">开始游戏</button>
                <button class="btn" onclick="pauseGame()">暂停</button>
            </div>

            <div class="mobile-controls">
                <div></div>
                <button class="mobile-btn" onclick="changeDirection('up')">↑</button>
                <div></div>
                <button class="mobile-btn" onclick="changeDirection('left')">←</button>
                <button class="mobile-btn" onclick="changeDirection('down')">↓</button>
                <button class="mobile-btn" onclick="changeDirection('right')">→</button>
            </div>
        </div>

        <div class="leaderboard">
            <h2>🏆 排行榜</h2>
            <div class="leaderboard-tabs">
                <button class="leaderboard-tab active" data-tab="normal">普通</button>
                <button class="leaderboard-tab" data-tab="challenge">挑战</button>
            </div>
            <ul class="leaderboard-list" id="leaderboardList">
                <li class="empty-leaderboard">暂无记录，快来挑战吧！</li>
            </ul>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>
    
    <!-- 游戏开始前模态框 -->
    <div class="start-modal" id="startModal">
        <h2>🎮 准备开始</h2>
        
        <div class="nickname-input">
            <input type="text" id="startNicknameInput" placeholder="输入你的昵称" maxlength="10">
            <p>最多10个字符</p>
        </div>
        
        <div class="settings-preview">
            <p>当前设置：</p>
            <p>难度: <strong id="startDifficulty">简单</strong></p>
            <p>主题: <strong id="startSkin">经典</strong></p>
            <p id="startChallengeText" style="display: none;">🎯 挑战模式: <strong>开启</strong></p>
        </div>
        
        <button class="btn" onclick="startGameFromModal()">开始游戏</button>
    </div>

    <div class="game-over" id="gameOver">
        <h2>游戏结束！</h2>
        <p>你的得分: <strong id="finalScore">0</strong></p>
        <p id="newHighScore" style="color: #667eea; display: none;">🎉 新纪录！</p>
        <p id="challengeResult" style="color: #ff6b6b; display: none;"></p>
        
        <button class="btn" onclick="restartGame()">再来一局</button>
    </div>

    <script>
        // 游戏配置
        const CONFIG = {
            difficulties: {
                easy: { speed: 150, name: '简单' },
                normal: { speed: 100, name: '普通' },
                hard: { speed: 60, name: '困难' }
            },
            skins: {
                default: {
                    bg: '#1a1a2e',
                    grid: '#2a2a4e',
                    snakeHead: ['#4ade80', '#22c55e'],
                    snakeBody: ['#22c55e', '#16a34a'],
                    food: '#ff6b6b'
                },
                ocean: {
                    bg: '#0c2340',
                    grid: '#1a3a5c',
                    snakeHead: ['#60a5fa', '#3b82f6'],
                    snakeBody: ['#3b82f6', '#2563eb'],
                    food: '#f472b6'
                },
                forest: {
                    bg: '#14532d',
                    grid: '#166534',
                    snakeHead: ['#a3e635', '#84cc16'],
                    snakeBody: ['#84cc16', '#65a30d'],
                    food: '#fb923c'
                },
                sunset: {
                    bg: '#4c1d95',
                    grid: '#6d28d9',
                    snakeHead: ['#fb923c', '#f97316'],
                    snakeBody: ['#f97316', '#ea580c'],
                    food: '#fbbf24'
                }
            },
            challengeTime: 60
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // 游戏状态
        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
        let gameLoop;
        let gameRunning = false;
        let gamePaused = false;
        let currentDifficulty = 'easy';
        let currentSkin = 'default';
        let soundEnabled = true;
        let challengeMode = false;
        let timer = CONFIG.challengeTime;
        let timerInterval;
        let currentTab = 'normal';
        let playerNickname = '';

        // 排行榜数据
        let leaderboard = {
            normal: JSON.parse(localStorage.getItem('snakeLeaderboard')) || [],
            challenge: JSON.parse(localStorage.getItem('snakeChallengeLeaderboard')) || []
        };

        // 音效系统
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!soundEnabled) return;

            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            switch(type) {
                case 'eat':
                    oscillator.frequency.value = 600;
                    oscillator.type = 'sine';
                    gainNode.gain.value = 0.3;
                    break;
                case 'gameover':
                    oscillator.frequency.value = 200;
                    oscillator.type = 'sawtooth';
                    gainNode.gain.value = 0.2;
                    break;
                case 'start':
                    oscillator.frequency.value = 400;
                    oscillator.type = 'sine';
                    gainNode.gain.value = 0.3;
                    break;
            }

            oscillator.start();
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
            oscillator.stop(audioContext.currentTime + 0.1);
        }

        // 初始化
        document.getElementById('highScore').textContent = highScore;
        updateLeaderboard();

        // 难度选择
        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (gameRunning) return;
                
                document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentDifficulty = btn.dataset.difficulty;
            });
        });

        // 皮肤选择
        document.querySelectorAll('.skin-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.skin-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSkin = btn.dataset.skin;
                if (!gameRunning) drawGame();
            });
        });

        // 挑战模式
        document.getElementById('challengeMode').addEventListener('change', (e) => {
            challengeMode = e.target.checked;
            const timerDisplay = document.getElementById('timerDisplay');
            const challengeInfo = document.getElementById('challengeInfo');
            
            if (challengeMode) {
                timerDisplay.classList.add('show');
                challengeInfo.style.display = 'block';
            } else {
                timerDisplay.classList.remove('show');
                challengeInfo.style.display = 'none';
            }
        });

        // 音效控制
        document.getElementById('soundEnabled').addEventListener('change', (e) => {
            soundEnabled = e.target.checked;
        });

        // 排行榜标签切换
        document.querySelectorAll('.leaderboard-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.leaderboard-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentTab = tab.dataset.tab;
                updateLeaderboard();
            });
        });

        function drawGame() {
            if (gamePaused) return;

            const skin = CONFIG.skins[currentSkin];

            // 移动蛇
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // 检查碰撞
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // 检查是否吃到食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                playSound('eat');
                generateFood();
            } else {
                snake.pop();
            }

            // 清空画布
            ctx.fillStyle = skin.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制网格
            ctx.strokeStyle = skin.grid;
            for (let i = 0; i < tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // 绘制食物
            ctx.fillStyle = skin.food;
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                gridSize / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();

            // 绘制蛇
            snake.forEach((segment, index) => {
                const gradient = ctx.createLinearGradient(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    segment.x * gridSize + gridSize,
                    segment.y * gridSize + gridSize
                );
                
                if (index === 0) {
                    gradient.addColorStop(0, skin.snakeHead[0]);
                    gradient.addColorStop(1, skin.snakeHead[1]);
                } else {
                    gradient.addColorStop(0, skin.snakeBody[0]);
                    gradient.addColorStop(1, skin.snakeBody[1]);
                }
                
                ctx.fillStyle = gradient;
                ctx.fillRect(
                    segment.x * gridSize + 1,
                    segment.y * gridSize + 1,
                    gridSize - 2,
                    gridSize - 2
                );

                // 绘制蛇头眼睛
                if (index === 0) {
                    ctx.fillStyle = 'white';
                    const eyeSize = 3;
                    const eyeOffset = 5;
                    
                    if (dx === 1) {
                        ctx.fillRect(segment.x * gridSize + gridSize - eyeOffset, segment.y * gridSize + 5, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + gridSize - eyeOffset, segment.y * gridSize + gridSize - 8, eyeSize, eyeSize);
                    } else if (dx === -1) {
                        ctx.fillRect(segment.x * gridSize + eyeOffset - eyeSize, segment.y * gridSize + 5, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + eyeOffset - eyeSize, segment.y * gridSize + gridSize - 8, eyeSize, eyeSize);
                    } else if (dy === -1) {
                        ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + eyeOffset - eyeSize, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + gridSize - 8, segment.y * gridSize + eyeOffset - eyeSize, eyeSize, eyeSize);
                    } else {
                        ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + gridSize - eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + gridSize - 8, segment.y * gridSize + gridSize - eyeOffset, eyeSize, eyeSize);
                    }
                }
            });
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    generateFood();
                    return;
                }
            }
        }

        function changeDirection(direction) {
            if (!gameRunning) return;

            switch(direction) {
                case 'up':
                    if (dy !== 1) { dx = 0; dy = -1; }
                    break;
                case 'down':
                    if (dy !== -1) { dx = 0; dy = 1; }
                    break;
                case 'left':
                    if (dx !== 1) { dx = -1; dy = 0; }
                    break;
                case 'right':
                    if (dx !== -1) { dx = 1; dy = 0; }
                    break;
            }
        }

        document.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd'].includes(e.key)) {
                e.preventDefault();
            }

            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    changeDirection('up');
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    changeDirection('down');
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    changeDirection('left');
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    changeDirection('right');
                    break;
            }
        });

        // 显示开始游戏模态框
        function showStartModal() {
            if (gameRunning) return;
            
            // 更新设置预览
            document.getElementById('startDifficulty').textContent = CONFIG.difficulties[currentDifficulty].name;
            document.getElementById('startSkin').textContent = document.querySelector(`.skin-btn[data-skin="${currentSkin}"]`).textContent;
            
            if (challengeMode) {
                document.getElementById('startChallengeText').style.display = 'block';
            } else {
                document.getElementById('startChallengeText').style.display = 'none';
            }
            
            // 清空输入框并聚焦
            document.getElementById('startNicknameInput').value = '';
            document.getElementById('startNicknameInput').focus();
            
            // 显示模态框
            document.getElementById('overlay').classList.add('show');
            document.getElementById('startModal').classList.add('show');
        }

        // 从模态框开始游戏
        function startGameFromModal() {
            const nickname = document.getElementById('startNicknameInput').value.trim();
            
            if (!nickname) {
                alert('请输入昵称！');
                return;
            }
            
            playerNickname = nickname;
            
            // 隐藏模态框
            document.getElementById('overlay').classList.remove('show');
            document.getElementById('startModal').classList.remove('show');
            
            // 开始游戏
            startGame();
        }

        function startGame() {
            if (gameRunning) return;

            snake = [{x: 10, y: 10}];
            dx = 1;
            dy = 0;
            score = 0;
            timer = CONFIG.challengeTime;
            document.getElementById('score').textContent = score;
            document.getElementById('timer').textContent = timer;
            generateFood();
            gameRunning = true;
            gamePaused = false;
            
            const speed = CONFIG.difficulties[currentDifficulty].speed;
            gameLoop = setInterval(drawGame, speed);
            
            playSound('start');

            // 挑战模式计时器
            if (challengeMode) {
                clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    if (!gamePaused && gameRunning) {
                        timer--;
                        document.getElementById('timer').textContent = timer;
                        
                        if (timer <= 0) {
                            gameOver(true);
                        }
                    }
                }, 1000);
            }
        }

        function pauseGame() {
            if (!gameRunning) return;
            gamePaused = !gamePaused;
        }

        function gameOver(timeUp = false) {
            gameRunning = false;
            clearInterval(gameLoop);
            clearInterval(timerInterval);
            
            document.getElementById('finalScore').textContent = score;
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                document.getElementById('highScore').textContent = highScore;
                document.getElementById('newHighScore').style.display = 'block';
            } else {
                document.getElementById('newHighScore').style.display = 'none';
            }

            // 挑战模式结果
            const challengeResult = document.getElementById('challengeResult');
            if (challengeMode) {
                if (timeUp) {
                    challengeResult.textContent = '⏰ 时间到！';
                } else {
                    challengeResult.textContent = `💔 游戏结束，还剩 ${timer} 秒`;
                }
                challengeResult.style.display = 'block';
            } else {
                challengeResult.style.display = 'none';
            }

            playSound('gameover');

            // 自动保存成绩
            if (playerNickname) {
                saveScore();
            }

            document.getElementById('overlay').classList.add('show');
            document.getElementById('gameOver').classList.add('show');
        }

        function saveScore() {
            if (!playerNickname) {
                return;
            }

            // 添加到排行榜
            const entry = {
                name: playerNickname,
                score: score,
                difficulty: currentDifficulty,
                date: new Date().toLocaleDateString('zh-CN')
            };

            const listKey = challengeMode ? 'challenge' : 'normal';
            leaderboard[listKey].push(entry);
            
            // 按分数排序，取前10名
            leaderboard[listKey].sort((a, b) => b.score - a.score);
            leaderboard[listKey] = leaderboard[listKey].slice(0, 10);
            
            // 保存到本地存储
            localStorage.setItem(
                challengeMode ? 'snakeChallengeLeaderboard' : 'snakeLeaderboard',
                JSON.stringify(leaderboard[listKey])
            );
            
            // 更新排行榜显示
            updateLeaderboard();
        }

        function updateLeaderboard() {
            const list = document.getElementById('leaderboardList');
            const currentList = leaderboard[currentTab];
            
            if (currentList.length === 0) {
                list.innerHTML = '<li class="empty-leaderboard">暂无记录，快来挑战吧！</li>';
                return;
            }

            list.innerHTML = currentList.map((entry, index) => {
                const rankClass = index < 3 ? `top-${index + 1}` : '';
                const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}`;
                
                return `
                    <li class="leaderboard-item ${rankClass}">
                        <span class="rank">${medal}</span>
                        <div class="player-info">
                            <div class="player-name">${entry.name}</div>
                        </div>
                        <span class="player-score">${entry.score}</span>
                    </li>
                `;
            }).join('');
        }

        function restartGame() {
            document.getElementById('overlay').classList.remove('show');
            document.getElementById('gameOver').classList.remove('show');
            showStartModal();
        }

        // 初始绘制
        drawGame();

        // 昵称输入框回车开始
        document.getElementById('startNicknameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                startGameFromModal();
            }
        });
    </script>
</body>
</html>
